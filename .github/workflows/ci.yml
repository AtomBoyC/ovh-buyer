name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit and integration tests
        run: python3 -m unittest discover -s tests -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ovh-buyer:ci .
      - name: Smoke test CLI forwarding
        run: docker run --rm ovh-buyer:ci --help
      - name: Smoke test container with root-owned bind mount (./data:/app/data)
        run: |
          sudo rm -rf /tmp/ovh-bind-data
          sudo mkdir -p /tmp/ovh-bind-data
          sudo chown root:root /tmp/ovh-bind-data
          sudo chmod 755 /tmp/ovh-bind-data
          docker run -d --name ovh-smoke -p 18888:8888 -v /tmp/ovh-bind-data:/app/data ovh-buyer:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18888/api/health; then
              echo ""
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:18888/api/health
          test -f /tmp/ovh-bind-data/ovh_buyer.db
          PROC_UID="$(docker exec ovh-smoke stat -c '%u' /proc/1)"
          echo "Container PID 1 UID: ${PROC_UID}"
          test "${PROC_UID}" = "1000"
          docker rm -f ovh-smoke
          sudo rm -rf /tmp/ovh-bind-data
